<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Target Recruit</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0A0A0A',
                        surface: '#121212',
                        'surface-highlight': '#1A1A1A',
                        electric: '#2563EB',
                        volt: '#CCFF00',
                    },
                    fontFamily: {
                        heading: ['Barlow Condensed', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                        mono: ['monospace'],
                    },
                }
            }
        }
    </script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-obsidian text-white">
    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md">
            <!-- Logo -->
            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center gap-2 mb-4">
                    <i data-lucide="target" class="w-10 h-10 text-electric"></i>
                    <span class="font-heading font-bold text-2xl uppercase tracking-wider text-white">
                        Target<span class="text-volt">Recruit</span>
                    </span>
                </a>
                <p class="text-gray-400">Join the future of athletic recruitment</p>
            </div>

            <!-- Auth Card -->
            <div class="bg-surface border border-white/10 rounded-sm p-6">
                <!-- Tabs -->
                <div class="grid grid-cols-2 gap-2 bg-obsidian rounded-sm p-1 mb-6">
                    <button id="login-tab" class="tab-btn active py-3 rounded-sm font-bold uppercase tracking-wider text-sm transition-all">
                        Login
                    </button>
                    <button id="register-tab" class="tab-btn py-3 rounded-sm font-bold uppercase tracking-wider text-sm transition-all">
                        Register
                    </button>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="text-sm text-gray-400 mb-2 block">Email</label>
                        <div class="relative">
                            <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                            <input type="email" id="login-email" placeholder="your@email.com" required class="w-full pl-10 bg-obsidian border border-white/10 text-white placeholder:text-gray-600 focus:border-electric h-12 px-3 rounded-sm">
                        </div>
                    </div>
                    
                    <div>
                        <label class="text-sm text-gray-400 mb-2 block">Password</label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                            <input type="password" id="login-password" placeholder="••••••••" required class="w-full pl-10 bg-obsidian border border-white/10 text-white placeholder:text-gray-600 focus:border-electric h-12 px-3 rounded-sm">
                        </div>
                    </div>

                    <p id="login-error" class="text-red-500 text-sm hidden"></p>

                    <button type="submit" id="login-submit" class="w-full bg-electric hover:bg-electric/90 text-white font-bold uppercase tracking-wider h-12 rounded-sm flex items-center justify-center gap-2">
                        <span>Sign In</span>
                        <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                </form>

                <!-- Register Form -->
                <form id="register-form" class="space-y-4 hidden">
                    <div>
                        <label class="text-sm text-gray-400 mb-2 block">Full Name</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                            <input type="text" id="register-name" placeholder="John Smith" required class="w-full pl-10 bg-obsidian border border-white/10 text-white placeholder:text-gray-600 focus:border-electric h-12 px-3 rounded-sm">
                        </div>
                    </div>

                    <div>
                        <label class="text-sm text-gray-400 mb-2 block">Email</label>
                        <div class="relative">
                            <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                            <input type="email" id="register-email" placeholder="your@email.com" required class="w-full pl-10 bg-obsidian border border-white/10 text-white placeholder:text-gray-600 focus:border-electric h-12 px-3 rounded-sm">
                        </div>
                    </div>

                    <div>
                        <label class="text-sm text-gray-400 mb-2 block">I am a...</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button type="button" id="role-athlete" class="role-btn p-4 rounded-sm border transition-all bg-volt/10 border-volt text-volt">
                                <span class="font-bold uppercase tracking-wider text-sm">Athlete</span>
                            </button>
                            <button type="button" id="role-coach" class="role-btn p-4 rounded-sm border transition-all bg-obsidian border-white/10 text-gray-400 hover:border-white/30">
                                <span class="font-bold uppercase tracking-wider text-sm">Coach</span>
                            </button>
                        </div>
                    </div>
                    
                    <div>
                        <label class="text-sm text-gray-400 mb-2 block">Password</label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                            <input type="password" id="register-password" placeholder="••••••••" required minlength="6" class="w-full pl-10 bg-obsidian border border-white/10 text-white placeholder:text-gray-600 focus:border-electric h-12 px-3 rounded-sm">
                        </div>
                    </div>

                    <div>
                        <label class="text-sm text-gray-400 mb-2 block">Confirm Password</label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                            <input type="password" id="register-confirm-password" placeholder="••••••••" required class="w-full pl-10 bg-obsidian border border-white/10 text-white placeholder:text-gray-600 focus:border-electric h-12 px-3 rounded-sm">
                        </div>
                    </div>

                    <p id="register-error" class="text-red-500 text-sm hidden"></p>

                    <button type="submit" id="register-submit" class="w-full bg-volt hover:bg-volt/90 text-black font-bold uppercase tracking-wider h-12 rounded-sm flex items-center justify-center gap-2">
                        <span>Create Account</span>
                        <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                </form>
            </div>

            <p class="text-center text-gray-500 text-sm mt-6">
                By continuing, you agree to our Terms of Service and Privacy Policy.
            </p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
